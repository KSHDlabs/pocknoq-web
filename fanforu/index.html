    <script>
      // 소개 링크(?src=r_코드)로 들어온 분이 [출시 알림 받기]를 누르면 신청 페이지에도 같은 src 를 넘겨 누가 소개했는지 남긴다.
      (function () {
        var src = '';
        try {
          src = new URLSearchParams(location.search).get('src') || sessionStorage.getItem('ffu_src') || '';
          if (!/^[A-Za-z0-9_]{1,20}$/.test(src)) src = '';
          if (src) sessionStorage.setItem('ffu_src', src);
        } catch (e) {}
        if (!src) return;
        document.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('a[href*="signup.html"]');
          if (a && a.href.indexOf('src=') < 0) a.href += (a.href.indexOf('?') < 0 ? '?' : '&') + 'src=' + encodeURIComponent(src);
        }, true);
      })();
    </script>
